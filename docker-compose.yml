services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: triageiq-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - triageiq-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: triageiq-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
    volumes:
      - ./deploy/sqlserver/init-database.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -i /init.sql
    restart: "no"

  servicebus-sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: triageiq-servicebus-sqledge
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${SERVICEBUS_SQL_PASSWORD}

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: triageiq-servicebus-emulator
    volumes:
      - ./deploy/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: servicebus-sqledge
      MSSQL_SA_PASSWORD: ${SERVICEBUS_SQL_PASSWORD}
      ACCEPT_EULA: ${ACCEPT_EULA}
      EMULATOR_HTTP_PORT: 5300
    depends_on:
      - servicebus-sqledge

  api:
    build:
      context: .
      dockerfile: src/TriageIQ.Api/Dockerfile
    container_name: triageiq-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Server=sqlserver,1433;Database=TriageIQ;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      ServiceBus__EmulatorHealthUrl: http://servicebus-emulator:5300/health
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      servicebus-emulator:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: src/TriageIQ.Worker/Dockerfile
    container_name: triageiq-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Default: Server=sqlserver,1433;Database=TriageIQ;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      servicebus-emulator:
        condition: service_started

volumes:
  triageiq-sql-data: