name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish-ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/triageiq-api:${{ github.ref_name }}
          docker build -f src/TriageIQ.Api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Build and push Worker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/triageiq-worker:${{ github.ref_name }}
          docker build -f src/TriageIQ.Worker/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Build and push Web image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/triageiq-web:${{ github.ref_name }}
          docker build -f web/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"